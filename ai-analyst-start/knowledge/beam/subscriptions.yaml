table: subscriptions
description: >
  One row per user's subscription. A user can hold several over time (for example
  monthly, then annual). Churn is always read from end_date, never from status.
  Revenue is not stored here; it lives in payments, which links on subscription_id.

fields:
  - name: subscription_id
    type: integer
    description: Unique identifier for the subscription. Primary key.
    role: key

  - name: user_id
    type: integer
    description: The user who holds the subscription. Joins to users.user_id. A user can appear on several rows.
    role: key

  - name: plan
    type: text
    description: The subscription plan. One of free, monthly or annual. Free subscriptions never end and have no end_date, so leave them out of any churn or retention calculation.
    role: dimension

  - name: start_date
    type: timestamp
    description: Date when the subscription started. A subscription counts as active at period_start only if start_date is before period_start.
    role: dimension

  - name: end_date
    type: timestamp
    description: Date when the subscription ended or is scheduled to end. Empty means the subscription is active. A date after the analysis date is a scheduled cancellation, and that subscription is still active today. This is the field to read churn from.
    role: dimension

  - name: status
    type: text
    description: Label on the subscription. One of active, expired or canceled. The label for ended subscriptions switched from expired to canceled for end dates from August 2026 on, so never read churn from status.
    role: dimension

measures:
  - name: active_paid_subscriptions
    formula: COUNT(subscription_id) FILTER (WHERE plan IN ('monthly', 'annual') AND start_date <= analysis_date AND (end_date IS NULL OR end_date > analysis_date))
    description: Paid subscriptions active on the analysis date. Scheduled cancellations (end_date after the analysis date) still count as active.

  - name: paid_subscriptions_at_period_start
    formula: COUNT(subscription_id) FILTER (WHERE plan IN ('monthly', 'annual') AND start_date < period_start AND (end_date IS NULL OR end_date >= period_start))
    description: Paid subscriptions active at the start of the period. This is the denominator for churn rates.

  - name: churned_subscriptions
    formula: COUNT(subscription_id) FILTER (WHERE plan IN ('monthly', 'annual') AND end_date >= period_start AND end_date < period_end)
    description: Paid subscriptions whose end_date falls in the period. Churn rates use paid plans only, dividing by paid subscriptions active at the start of the period.

  - name: churn_rate
    formula: churned_subscriptions / NULLIF(paid_subscriptions_at_period_start, 0)
    description: >
      Share of paid subscriptions active at period_start whose end_date falls in
      the period. Count churn only for subscriptions in the denominator (started
      before period_start), as the golden query does.

  - name: new_paid_subscriptions
    formula: COUNT(subscription_id) FILTER (WHERE plan IN ('monthly', 'annual') AND start_date >= period_start AND start_date < period_end)
    description: Paid subscriptions that started in the period.

  - name: active_paid_subscribers
    formula: COUNT(DISTINCT user_id) FILTER (WHERE plan IN ('monthly', 'annual') AND start_date <= analysis_date AND (end_date IS NULL OR end_date > analysis_date))
    description: Distinct users with at least one active paid subscription on the analysis date. Use this, not a subscription count, for "how many paying customers".

derived_dimensions:
  - name: tenure_band
    description: >
      How long a subscriber had been paying at the start of the period being
      analysed. Beam cuts tenure into these four bands and no others, so that
      groups compare across analyses.
    formula: |
      CASE
        WHEN period_start - start_date < INTERVAL '6 months'  THEN 'under 6 months'
        WHEN period_start - start_date < INTERVAL '12 months' THEN '6 to 12 months'
        WHEN period_start - start_date < INTERVAL '24 months' THEN '12 to 24 months'
        ELSE 'over 24 months'
      END

  - name: is_paid
    description: True for monthly and annual plans, false for free.
    formula: plan IN ('monthly', 'annual')

  - name: start_month
    description: Calendar month the subscription started, for acquisition cohorts.
    formula: DATE_TRUNC('month', start_date)::date

golden_queries:
  - name: monthly_paid_churn_rate
    description: Monthly churn rate for paid plans, the share of paid subscriptions active at the start of each month that ended during it
    sql: |
      WITH months AS (
        SELECT generate_series(DATE '2026-01-01', DATE '2026-08-01', INTERVAL '1 month')::date AS month_start
      )
      SELECT m.month_start,
             COUNT(*) AS paid_at_month_start,
             COUNT(*) FILTER (WHERE s.end_date < m.month_start + INTERVAL '1 month') AS churned_subscriptions,
             ROUND(COUNT(*) FILTER (WHERE s.end_date < m.month_start + INTERVAL '1 month')::numeric / COUNT(*), 4) AS churn_rate
      FROM months m
      JOIN subscriptions s
        ON s.plan IN ('monthly', 'annual')
       AND s.start_date < m.month_start
       AND (s.end_date IS NULL OR s.end_date >= m.month_start)
      GROUP BY m.month_start
      ORDER BY m.month_start;

  - name: monthly_churn_rate_by_plan_and_tenure
    description: Monthly paid churn split by plan and tenure band, using the standard four tenure bands
    sql: |
      WITH months AS (
        SELECT generate_series(DATE '2026-01-01', DATE '2026-08-01', INTERVAL '1 month')::date AS month_start
      )
      SELECT m.month_start,
             s.plan,
             CASE
               WHEN m.month_start - s.start_date < INTERVAL '6 months'  THEN 'under 6 months'
               WHEN m.month_start - s.start_date < INTERVAL '12 months' THEN '6 to 12 months'
               WHEN m.month_start - s.start_date < INTERVAL '24 months' THEN '12 to 24 months'
               ELSE 'over 24 months'
             END AS tenure_band,
             COUNT(*) AS paid_at_month_start,
             COUNT(*) FILTER (WHERE s.end_date < m.month_start + INTERVAL '1 month') AS churned_subscriptions,
             ROUND(COUNT(*) FILTER (WHERE s.end_date < m.month_start + INTERVAL '1 month')::numeric / COUNT(*), 4) AS churn_rate
      FROM months m
      JOIN subscriptions s
        ON s.plan IN ('monthly', 'annual')
       AND s.start_date < m.month_start
       AND (s.end_date IS NULL OR s.end_date >= m.month_start)
      GROUP BY 1, 2, 3
      ORDER BY 1, 2, 3;

  - name: active_paid_subscriptions_today_by_plan
    description: Paid subscriptions active today, counting scheduled cancellations as still active
    sql: |
      SELECT plan,
             COUNT(*) AS active_subscriptions,
             COUNT(*) FILTER (WHERE end_date IS NOT NULL) AS scheduled_to_cancel
      FROM subscriptions
      WHERE plan IN ('monthly', 'annual')
        AND start_date <= CURRENT_DATE
        AND (end_date IS NULL OR end_date > CURRENT_DATE)
      GROUP BY plan
      ORDER BY plan;
